<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>Anzolin Consultoria</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    (function () {

      /*
       * Guarda a rota que o visitante tentou acessar.
       */

      var path =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      sessionStorage.setItem(
        'anzolinRedirectPath',
        path
      );

      /*
       * Volta para a raiz.
       *
       * O index.html recuperará a rota e abrirá
       * essa mesma página dentro do Lovable.
       */

      window.location.replace('/');

    })();
  </script>
</head>

<body>
  Redirecionando...
</body>
</html>
