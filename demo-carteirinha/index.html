<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#123f3b">

  <title>Validação de Carteirinha — Clube Modelo</title>

  <style>
    :root {
      --primary: #123f3b;
      --accent: #c7a55b;
      --bg: #f2f5f4;
      --text: #172522;
      --muted: #60706c;
      --ok: #177245;
      --bad: #b42318;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #e7efed, #f7f8f7);
      color: var(--text);
      font: 16px/1.5 Arial, sans-serif;
    }

    .wrap {
      width: min(92%, 620px);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .demo {
      padding: 7px 12px;
      background: var(--primary);
      color: #ffffff;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    header {
      padding: 30px 16px 20px;
      text-align: center;
    }

    .mark {
      display: grid;
      width: 78px;
      height: 78px;
      margin: auto;
      place-items: center;
      border: 4px solid var(--accent);
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
    }

    h1 {
      margin: 14px 0 4px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .panel {
      padding: 24px;
      border: 1px solid #dde6e3;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 14px 38px rgba(18, 63, 59, 0.12);
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #bac8c4;
      border-radius: 10px;
      font-size: 16px;
      text-transform: uppercase;
    }

    input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(199, 165, 91, 0.28);
    }

    button {
      padding: 0 19px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .message {
      padding: 24px 8px;
      color: var(--muted);
      text-align: center;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border: 4px solid #dce6e3;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result {
      display: none;
      text-align: center;
    }

    .photo-wrap {
      display: none;
      width: 126px;
      height: 126px;
      margin: 4px auto 20px;
      padding: 4px;
      overflow: hidden;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(18, 63, 59, 0.16);
    }

    .photo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #e7efed;
      object-fit: cover;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: #e8f6ee;
      color: var(--ok);
      font-weight: 700;
    }

    .status.bad {
      background: #fff0ee;
      color: var(--bad);
    }

    .status::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .name {
      margin: 18px 0 3px;
      font-size: 25px;
    }

    .category {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .data {
      border-top: 1px solid #e4ebe9;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #e4ebe9;
    }

    .label {
      color: var(--muted);
    }

    .value {
      font-weight: 700;
      text-align: right;
    }

    .error {
      display: none;
      padding: 22px;
      color: var(--bad);
      text-align: center;
    }

    footer {
      padding: 20px 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 520px) {
      form {
        flex-direction: column;
      }

      button {
        padding: 13px;
      }

      .panel {
        padding: 19px;
      }

      .wrap {
        padding-top: 18px;
      }

      .row {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="demo">
    Ambiente de demonstração
  </div>

  <main class="wrap">
    <header>
      <div class="mark" aria-label="Logotipo demonstrativo">
        CM
      </div>

      <h1>Clube Modelo</h1>

      <p>Validação de carteirinha digital</p>
    </header>

    <section class="panel">
      <form id="search">
        <input
          id="code"
          name="codigo"
          type="text"
          placeholder="Digite o código de validação"
          autocomplete="off"
          required
        >

        <button type="submit">
          Validar
        </button>
      </form>

      <div id="message" class="message">
        Informe o código ou leia o QR Code da carteirinha.
      </div>

      <div id="result" class="result" aria-live="polite">
        <div id="photoWrap" class="photo-wrap">
          <img
            id="photo"
            class="photo"
            alt="Foto do associado"
          >
        </div>

        <div id="status" class="status">
          Ativo
        </div>

        <h2 id="name" class="name"></h2>

        <p id="category" class="category"></p>

        <div class="data">
          <div class="row">
            <span class="label">
              Número do associado
            </span>

            <span id="number" class="value"></span>
          </div>

          <div class="row">
            <span class="label">
              Validade
            </span>

            <span id="validity" class="value"></span>
          </div>
        </div>
      </div>

      <div
        id="error"
        class="error"
        role="alert"
      ></div>
    </section>

    <footer>
      Modelo demonstrativo. A versão definitiva recebe a identidade
      e o endereço da instituição contratante.
    </footer>
  </main>

  <script>
    const API =
      "https://script.google.com/macros/s/AKfycbyw9kV--ZelnBTtZLjdPXht3WQFZULVoHNkxgOjtqOQ0MfLie3_5HOAFfobcdRAAJhI/exec";

    const form =
      document.getElementById("search");

    const input =
      document.getElementById("code");

    const message =
      document.getElementById("message");

    const result =
      document.getElementById("result");

    const error =
      document.getElementById("error");

    const photo =
      document.getElementById("photo");

    const photoWrap =
      document.getElementById("photoWrap");

    function showLoading() {
      result.style.display = "none";
      error.style.display = "none";
      message.style.display = "block";

      message.innerHTML =
        '<div class="spinner"></div>' +
        "Consultando carteirinha…";
    }

    function showError(text) {
      message.style.display = "none";
      result.style.display = "none";

      photoWrap.style.display = "none";
      photo.removeAttribute("src");

      error.textContent = text;
      error.style.display = "block";
    }

    function showResult(associado) {
      message.style.display = "none";
      error.style.display = "none";

      document.getElementById("name").textContent =
        associado.nome || "Não informado";

      document.getElementById("category").textContent =
        associado.categoria || "Categoria não informada";

      document.getElementById("number").textContent =
        associado.numero || "—";

      document.getElementById("validity").textContent =
        associado.validade || "—";

      const status =
        document.getElementById("status");

      const statusAssociado =
        associado.status || "Ativo";

      status.textContent =
        statusAssociado;

      status.classList.toggle(
        "bad",
        !/^(ativo|válido)$/i.test(statusAssociado)
      );

      photoWrap.style.display = "none";
      photo.removeAttribute("src");

      if (associado.foto) {
        photo.onload = function () {
          photoWrap.style.display = "block";
        };

        photo.onerror = function () {
          photoWrap.style.display = "none";
          photo.removeAttribute("src");
        };

        photo.src =
          associado.foto;
      }

      result.style.display = "block";
    }

    async function validate(code) {
      code =
        String(code || "").trim();

      if (!code) {
        showError(
          "Informe um código de validação."
        );

        return;
      }

      input.value = code;

      showLoading();

      try {
        const endereco =
          API +
          "?codigo=" +
          encodeURIComponent(code) +
          "&t=" +
          Date.now();

        const response =
          await fetch(endereco, {
            method: "GET",
            redirect: "follow",
            cache: "no-store"
          });

        if (!response.ok) {
          throw new Error(
            "Erro na consulta."
          );
        }

        const data =
          await response.json();

        if (
          !data.sucesso ||
          !data.associado
        ) {
          showError(
            data.mensagem ||
            "Carteirinha não encontrada."
          );

          return;
        }

        showResult(
          data.associado
        );

      } catch (erroConsulta) {
        console.error(
          erroConsulta
        );

        showError(
          "Não foi possível consultar a carteirinha agora. Tente novamente."
        );
      }
    }

    form.addEventListener(
      "submit",
      function (evento) {
        evento.preventDefault();

        validate(
          input.value
        );
      }
    );

    const codigoInicial =
      new URLSearchParams(
        window.location.search
      ).get("codigo");

    if (codigoInicial) {
      validate(
        codigoInicial
      );
    }
  </script>
</body>
</html>
